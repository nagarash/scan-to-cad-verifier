# Candidate generator models, addressed by OpenRouter id.
# Pricing is fetched live from https://openrouter.ai/api/v1/models when a
# run starts; the values below are documentation only.
models:
  - id: openai/gpt-5.2
    label: Astra (frontier baseline)
    notes: Current production generator. Reference point for the cost frontier.

  - id: anthropic/claude-opus-4-6
    label: Claude Opus (frontier)
    notes: Strong spatial reasoning; second frontier reference.

  - id: openai/gpt-5.2-mini
    label: GPT mini
    notes: First cheap candidate. Same family, lower reasoning budget.

  - id: anthropic/claude-sonnet-4-6
    label: Claude Sonnet
    notes: Mid-tier candidate.

  - id: google/gemini-3-flash
    label: Gemini Flash
    notes: Cheapest frontier-lab candidate.

  # Specialized CAD program model (local weights, ~3GB).
  # Not an OpenRouter id: run locally, record cost as compute time.
  - id: local/cad-recode-v1.5
    label: CAD-Recode 1.5 (local)
    notes: >
      Specialized CAD-sequence model. Restore third_party/cad_recode and
      scripts/download_recode.py to enable. Cost tracked as GPU-hours,
      not tokens.
